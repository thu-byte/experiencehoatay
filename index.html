<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoatay — Art Consulting Studio</title>
<meta name="description" content="Hoatay is a boutique luxury art consulting studio based in Ho Chi Minh City. Our website is being refined and returns this month. For portfolio inquiries, please write to studio@experiencehoatay.com.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Hoatay — Art Consulting Studio">
<meta property="og:description" content="Our website is being refined. We return this month.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#2C2B2B;
  --deep:#3F3D3D;
  --stone:#8A8787;
  --mist:#D5D3D0;
  --chalk:#F0EDEA;
  --ivory:#F8F6F3;
  --gold-deep:#8B6E3A;
  --gold:#B09060;
  --gold-warm:#D4B88A;
  --display:'Cormorant Garamond',Georgia,serif;
  --body:'EB Garamond',Georgia,serif;
}

html,body{height:100%}

body{
  background:#141210;
  color:var(--ivory);
  font-family:var(--body);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

.stage{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  isolation:isolate;
}

.video-wrap{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#141210;
  /* Poster shows instantly — covers the case where the video can't autoplay
     (iOS Low Power Mode, Android Data Saver, etc.) so the page never looks blank. */
  background-image:url("poster.jpg");
  background-size:cover;
  background-position:center;
}

.video-wrap video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 1.2s ease;
}

.video-wrap video.ready{opacity:1}

.video-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,
      rgba(20,18,16,0.65) 0%,
      rgba(20,18,16,0.15) 28%,
      rgba(20,18,16,0.20) 58%,
      rgba(20,18,16,0.80) 100%);
  pointer-events:none;
}

.content{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:56px 36px 44px;
  gap:48px;
}

.brand{text-align:center}

.wordmark{
  font-family:var(--display);
  font-weight:300;
  font-size:clamp(38px,6.5vw,64px);
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--ivory);
  line-height:1;
}

.tagline{
  margin-top:18px;
  font-size:14px;
  font-weight:400;
  letter-spacing:0.34em;
  text-transform:uppercase;
  color:var(--gold-warm);
}

.message{
  text-align:center;
  max-width:560px;
  margin:0 auto;
}

.divider{
  width:1px;
  height:56px;
  background:var(--gold);
  opacity:0.55;
  margin:0 auto 32px;
}

.notice{
  font-family:var(--display);
  font-weight:300;
  font-style:italic;
  font-size:clamp(24px,3.2vw,34px);
  line-height:1.45;
  color:var(--ivory);
}

.notice .emph{
  font-style:normal;
  font-weight:400;
  color:var(--gold-warm);
  display:block;
  margin-top:4px;
}

.contact{
  margin-top:40px;
  font-size:13px;
  letter-spacing:0.06em;
  color:var(--mist);
}

.contact a{
  display:inline-block;
  margin-top:10px;
  color:var(--ivory);
  text-decoration:none;
  border-bottom:1px solid var(--gold);
  padding:2px 2px 4px;
  font-family:var(--display);
  font-style:italic;
  font-size:22px;
  letter-spacing:0.02em;
  transition:color 0.35s ease,border-color 0.35s ease;
}

.contact a:hover,
.contact a:focus-visible{
  color:var(--gold-warm);
  border-color:var(--gold-warm);
  outline:none;
}

.footer{
  text-align:center;
  font-size:10px;
  letter-spacing:0.36em;
  text-transform:uppercase;
  color:var(--stone);
}

@media (max-width:600px){
  .content{padding:44px 24px 36px;gap:32px}
  .wordmark{font-size:clamp(34px,11vw,46px);letter-spacing:0.18em}
  .tagline{margin-top:14px;font-size:11px;letter-spacing:0.26em}
  .divider{height:40px;margin-bottom:22px}
  .notice{font-size:clamp(21px,6vw,26px);line-height:1.4}
  .message{max-width:92%}
  .contact{margin-top:32px;font-size:13px}
  .contact a{font-size:20px;padding:4px 2px 6px}
  .footer{font-size:9px;letter-spacing:0.3em}
}

/* Very short landscape phones — keep everything on one screen. */
@media (max-height:480px) and (orientation:landscape){
  .content{padding:24px 24px 18px;gap:16px}
  .divider{height:24px;margin-bottom:14px}
  .contact{margin-top:18px}
}

@media (prefers-reduced-motion:reduce){
  .video-wrap video{transition:none}
}
</style>
</head>
<body>
<div class="stage">

  <div class="video-wrap" aria-hidden="true">
    <video id="hero" autoplay muted loop playsinline webkit-playsinline
           preload="auto" poster="poster.jpg" disablepictureinpicture
           disableremoteplayback x5-playsinline>
      <source src="hero-video-mobile.mp4" type="video/mp4" media="(max-width:768px)">
      <source src="hero-video.mp4" type="video/mp4">
    </video>
  </div>

  <div class="content">
    <header class="brand">
      <h1 class="wordmark">Hoatay</h1>
      <div class="tagline">Art Consulting Firm</div>
    </header>

    <section class="message">
      <div class="divider" aria-hidden="true"></div>
      <p class="notice">
        Our studio website is being refined.
        <span class="emph">We return this month.</span>
      </p>
      <div class="contact">
        For portfolio inquiries, please write to
        <br>
        <a href="mailto:studio@experiencehoatay.com">studio@experiencehoatay.com</a>
      </div>
    </section>

    <footer class="footer">Hoatay JSC · Ho Chi Minh City</footer>
  </div>

</div>

<script>
  // Fade video in once it can play, and work hard to autoplay on mobile.
  // If the browser blocks autoplay (iOS Low Power Mode, Data Saver, etc.),
  // the CSS poster image stays visible so the page never looks broken, and
  // we retry playback on the first user interaction.
  (function(){
    var v = document.getElementById('hero');
    if(!v) return;

    function ready(){ v.classList.add('ready'); }

    function tryPlay(){
      var p = v.play();
      if(p && typeof p.then === 'function'){
        p.then(ready).catch(function(){
          // Autoplay blocked — poster remains; wait for a user gesture.
        });
      } else {
        ready();
      }
    }

    // Reveal as soon as there are enough frames.
    if(v.readyState >= 3){ ready(); }
    else { v.addEventListener('canplay', ready, { once:true }); }

    // Attempt immediate playback.
    if(v.readyState >= 2){ tryPlay(); }
    else { v.addEventListener('loadeddata', tryPlay, { once:true }); }

    // Fallback: first interaction kicks off playback on restrictive mobile browsers.
    var kick = function(){
      tryPlay();
      ['touchstart','click','scroll'].forEach(function(ev){
        window.removeEventListener(ev, kick);
      });
    };
    ['touchstart','click','scroll'].forEach(function(ev){
      window.addEventListener(ev, kick, { passive:true });
    });

    // Re-attempt when the tab becomes visible again (e.g. returning to the page).
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden){ tryPlay(); }
    });
  })();
</script>
</body>
</html>
